<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Website Builder — Previews</title>
<style>
:root{--bg:#0d0d0d;--fg:#e8e8e8;--mut:#9a9a9a;--ac:#C8102E}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
main{max-width:560px;padding:40px 28px;text-align:center}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.bar{height:3px;width:54px;background:var(--ac);margin:14px auto 22px;border-radius:2px}
p{color:var(--mut);margin:10px 0}code{color:var(--fg);background:#1a1a1a;padding:2px 7px;border-radius:5px;font-size:14px}
</style></head>
<body><main>
<h1>Website Builder</h1><div class="bar"></div>
<p>Free, on-spec preview websites for local businesses. Each preview lives at
<code>/&lt;business-key&gt;/</code>.</p>
<p>These are previews shared by direct link. After a business purchases, its site
moves to its own production domain.</p>
</main></body></html>
